    html, body { margin: 0; height: 100%; background: #F7F5FA; font-family: Arial, Helvetica, sans-serif; }

    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #F7F5FA; transition: opacity .4s; z-index: 2;
    }
    #carga img { height: 60px; }
    #carga .barra { width: 160px; height: 4px; border-radius: 4px; background: #e6deef; overflow: hidden; }
    #carga .barra::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #852D81, #1EAAC6); animation: mover 1.1s ease-in-out infinite;
    }
    #carga p { margin: 0; color: #7a7285; font-size: 13px; }
    #ayuda { display: none; font-size: 12px; color: #7a7285; text-align: center; max-width: 320px; line-height: 1.5; }
    #ayuda a { color: #623F82; font-weight: bold; }
    @keyframes mover { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

    // ▼ Link de la aplicación web de Apps Script (termina en /exec)

    panel.addEventListener('load', () => {
      carga.style.opacity = '0';
      setTimeout(() => carga.style.display = 'none', 400);
